
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://i.ibb.co/d4L6Zb0d/revivoheal-favicon.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/d4L6Zb0d/revivoheal-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevivoHeal Bangalore | Centre for Pain Relief & Healing</title>
    <meta name="description" content="Experience pain relief at RevivoHeal Bangalore with Hijama cupping and traditional massage therapies. Natural healing by certified professionals. Book now." />
    
    <!-- Critical CSS inline to prevent render blocking -->
    <style>
      /* Critical above-the-fold styles */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 142 76% 36%;
        --primary-foreground: 210 40% 98%;
        --border: 214.3 31.8% 91.4%;
        --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        
        /* Brand colors for LCP optimization */
        --brand-green: 142 76% 36%;
        --brand-gold: 45 100% 50%;
      }
      
      * { 
        box-sizing: border-box; 
      }
      
      body {
        margin: 0;
        padding: 0;
        font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.5;
        font-weight: 400;
        overflow-x: hidden;
        contain: layout style;
        overflow-anchor: none;
        font-display: swap;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
      }
      
      /* Critical LCP element optimization */
      .lcp-heading {
        font-size: 2.25rem;
        font-weight: 700;
        color: hsl(var(--brand-green));
        margin-bottom: 1.5rem;
        margin-top: 1rem;
        line-height: 1.1;
        text-align: center;
        /* Optimize for fast rendering and prevent forced reflows */
        font-display: swap;
        will-change: auto;
        contain: layout style paint;
        /* Prevent layout shifts and forced reflows */
        min-height: 3rem;
        transform: translateZ(0);
      }
      
      @media (min-width: 768px) {
        .lcp-heading {
          font-size: 3rem;
          min-height: 3.5rem;
        }
      }
      
      /* Critical section styles - prevent forced reflows */
      .main-services-section {
        padding: 5rem 0;
        background: linear-gradient(to bottom, #ffffff, #f9fafb);
        contain: layout style paint;
        will-change: auto;
        transform: translateZ(0);
      }
      
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }
      
      @media (min-width: 640px) {
        .container {
          padding: 0 1.5rem;
        }
      }
      
      @media (min-width: 1024px) {
        .container {
          padding: 0 2rem;
        }
      }
      
      /* Critical header/navigation styles */
      nav, header {
        contain: layout style;
      }
      
      /* Critical button styles */
      button {
        font-family: inherit;
        border: 0;
        font-size: 100%;
        line-height: 1.15;
        margin: 0;
        contain: layout;
        will-change: transform;
      }
      
      /* Critical interactive elements */
      a, [role="button"] {
        contain: layout;
        will-change: transform;
        text-decoration: inherit;
        color: inherit;
      }
      
      /* Prevent layout shifts */
      img, video, iframe {
        max-width: 100%;
        height: auto;
        contain: layout;
      }
      
      /* Critical loading state */
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      /* Optimize font rendering for LCP */
      .text-brand-green { color: hsl(var(--brand-green)); }
      .text-brand-gold { color: hsl(var(--brand-gold)); }
      .font-bold { font-weight: 700; }
      .text-center { text-align: center; }
      .mb-6 { margin-bottom: 1.5rem; }
      .mt-4 { margin-top: 1rem; }
    </style>
    
    <!-- Preload critical fonts for LCP optimization -->
    <link rel="preload" href="/fonts/Inter-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    
    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://zywvlznelzpoixnrzwqk.supabase.co" />
    <link rel="preconnect" href="https://api.razorpay.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    
    <!-- Load CSS asynchronously to prevent render blocking with cache optimization -->
    <link rel="preload" href="/src/index.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <!-- Cache optimization meta tags -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable">
    <meta name="expires" content="31536000">
    
    <!-- Preload critical resources with cache optimization -->
    <link rel="modulepreload" href="/src/main.tsx" as="script" />
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Analytics with reduced main thread impact -->
    <script>
      // Defer GA to reduce FID impact
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7X8Z9633RK', {
        // Reduce impact on main thread
        send_page_view: false
      });
      
      // Load GA script after main content
      setTimeout(() => {
        const script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-7X8Z9633RK';
        script.async = true;
        document.head.appendChild(script);
      }, 100);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Load main script with optimized loading strategy -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Performance optimization: prevent layout thrashing -->
    <script>
      // Batch DOM reads and writes to reduce FID
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          // Non-critical initialization can happen here
          console.log('App initialized');
        });
      }
    </script>
  </body>
</html>
